name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Monday 04:00 UTC (09:30 IST): catch breakage from new Flutter/Dart releases.
    - cron: '0 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plugin:
    name: Plugin (Flutter ${{ matrix.label }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: '3.27.4'
            version: '3.27.4'
          - label: stable
            version: ''
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ matrix.version }}
          channel: stable
          cache: true
      # The minimum-Flutter leg verifies the published PACKAGE only. example/ is a demo app that
      # tracks latest dependencies (needs a newer Dart than the package supports), so it is
      # analyzed and built on stable in its own job.
      - if: matrix.label == '3.27.4'
        run: |
          rm -rf example
          # Demo/smoke tests that import example/ code cannot run without it.
          grep -rl --include='*.dart' -E '\.\./example/' lib test tool 2>/dev/null | xargs -r rm -v || true
      # server/ is a deployable app (needs Dart >= 3.10), not part of the published package; it
      # is tested on stable in the server job. Drop the dev-dependency used only by its e2e test.
      - if: matrix.label == '3.27.4'
        run: |
          sed -i '/^  deferred_links_server:$/,/^    path: server$/d' pubspec.yaml
          rm test/e2e_server_test.dart
      - run: flutter pub get
      - run: flutter analyze --fatal-infos
      - run: flutter test

  server:
    name: Server (Dart stable)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1
      - run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev
      - run: dart pub get
      - run: dart analyze --fatal-infos
      - run: dart test
      - run: docker build -t deferred-links-server .

  publish-dry-run:
    name: Publish dry run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart pub publish --dry-run
