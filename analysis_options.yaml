include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - build/**
    - server/**
    - example/**
    - android/**
    - ios/**
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true

linter:
  rules:
    - public_member_api_docs
    - prefer_final_locals
    - unawaited_futures
